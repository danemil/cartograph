name: build

# One .vsix per platform, each carrying that platform's frozen engine.
# PyInstaller freezes the interpreter it runs on and cannot cross-compile, so
# every target needs a runner of its own — which is the whole reason this is CI
# rather than a script someone runs on a laptop, and why no Windows payload has
# ever existed.
#
# Linux is a separate job rather than a matrix row because it builds inside a
# container and the others do not. A matrix carrying `container: ''` for the
# rest is not valid, and GitHub rejects the whole file rather than that row.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    # Deliberately an OLD image. PyInstaller bundles libpython but NOT libc, so
    # the binary demands the glibc of whatever built it. ubuntu-latest is glibc
    # 2.39; the locked-down machines this ships to are far more often RHEL 9,
    # Ubuntu 22.04 or Debian 12, where such a binary dies at `carto --version`
    # with a message nobody can act on. bookworm is 2.36 and runs on all of
    # them. docker/acceptance.sh caught exactly this defect once already — do
    # not "modernise" this line.
    container: python:3.12-slim-bookworm
    steps:
      # binutils is the one that is easy to miss and fails late: PyInstaller
      # shells out to objdump to find each shared library's dependencies, so
      # without it the freeze dies after the venv and the pip install have
      # already run. docker/Dockerfile installs it for the same reason — this
      # list is deliberately the same one, so the two cannot drift.
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils ca-certificates git zip curl
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the payload
        run: python scripts/build-payload.py --target linux-x64
      - name: Package the .vsix
        run: ./scripts/build-vsix.sh linux-x64
      - name: The frozen engine must build a non-empty graph
        run: python scripts/ci_smoke.py linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: carto-linux-x64
          path: dist/*.vsix
          if-no-files-found: error

  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-latest }
          - { target: win32-x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Needs the network, and that is the point: it is spent HERE so the
      # artifact needs none. The payload carries its own tree-sitter grammars.
      - name: Build the payload
        shell: bash
        run: python scripts/build-payload.py --target ${{ matrix.target }}
      - name: Package the .vsix
        shell: bash
        run: ./scripts/build-vsix.sh ${{ matrix.target }}
      - name: The frozen engine must build a non-empty graph
        shell: bash
        run: python scripts/ci_smoke.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: carto-${{ matrix.target }}
          path: dist/*.vsix
          if-no-files-found: error

  release:
    needs: [linux, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          fail_on_unmatched_files: true
