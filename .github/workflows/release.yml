name: build

# One .vsix per platform, each carrying that platform's frozen engine.
# PyInstaller freezes the interpreter it runs on and cannot cross-compile, so
# every target needs a runner of its own — which is the whole reason this is CI
# rather than a script someone runs on a laptop, and why no Windows payload has
# ever existed.
#
# Linux is a separate job rather than a matrix row because it builds inside a
# container and the others do not. A matrix carrying `container: ''` for the
# rest is not valid, and GitHub rejects the whole file rather than that row.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    # Deliberately an OLD image. PyInstaller bundles libpython, libstdc++ and
    # the rest but NOT libc, so every ELF file in the payload demands the glibc
    # of whatever built it. ubuntu-latest is 2.39. 0.8.0 built on Debian 12
    # (2.36): the graph ran on Ubuntu 22.04 and the embedding runtime did not,
    # because the bundled libstdc++ needed GLIBC_2.36. Debian 11 is not an
    # option any more (EOL, its security mirror 404s mid-archive), so this is
    # the manylinux_2_28 image (AlmaLinux 8, glibc 2.28), maintained for exactly
    # this purpose. Its own CPython is static and PyInstaller needs a shared
    # libpython, so the build freezes uv's CPython instead. The payload's floor
    # is asserted below, and proven on the targets in `linux-targets`. Do not
    # "modernise" this line.
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
      # For `unshare --net` in scripts/ci_smoke.py: the offline proof runs the
      # frozen engine in a network namespace with no interfaces, and creating
      # one needs CAP_SYS_ADMIN and a seccomp profile that allows unshare(2).
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      # The image already carries binutils (PyInstaller shells out to objdump
      # for each library's dependencies), git, curl, zip and uv. Rust is for
      # tree-sitter-language-pack, compiled here because its only Linux wheel
      # is manylinux_2_34 (see build-payload.py).
      - name: Install build prerequisites
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          uv python install 3.12
          echo "PY=$(uv python find --managed-python 3.12)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the payload
        run: $PY scripts/build-payload.py --target linux-x64 --python "$PY"
      # The floor, measured rather than inferred from the build image: the
      # newest GLIBC_x.y any ELF file in the payload references. Fails above
      # 2.31 (Debian 11, Ubuntu 20.04), so a new dependency with a newer wheel
      # cannot raise it without this step saying which file did.
      - name: The payload needs no glibc newer than 2.31
        shell: bash
        run: $PY scripts/check-glibc.py dist/payload/linux-x64 --max 2.31 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Package the .vsix
        run: ./scripts/build-vsix.sh linux-x64
      # Also: memory search embeds and finds a reworded memory with no
      # network, and the measured cost (cold search, RSS, per-row, sizes).
      - name: The frozen engine parses, and searches memory offline
        # Named explicitly: only an explicit bash gets -o pipefail, and without
        # it the tee would pass a failed smoke.
        shell: bash
        run: $PY scripts/ci_smoke.py linux-x64 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: carto-linux-x64
          path: dist/*.vsix
          if-no-files-found: error

  # The build image proves nothing about the machines the payload is for. This
  # runs the shipped .vsix on them: unzipped as VS Code would, in plain
  # distribution images that have no Python, under the same network block.
  # Their only additions are git (the smoke test makes a repository) and a
  # standalone CPython for the harness itself, kept outside the system library
  # paths so it cannot lend the frozen engine anything.
  linux-targets:
    name: linux-x64 on ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:20.04", "debian:11"]
    container:
      image: ${{ matrix.image }}
      options: --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - name: Install git
        run: |
          export DEBIAN_FRONTEND=noninteractive
          if grep -q bullseye /etc/os-release; then
            # Debian 11 left LTS on 2026-08-31 and its mirrors are mid-archive:
            # the index lists security updates the pool no longer has. The
            # image's own pinned snapshot sources are consistent.
            sed -i -e 's|^deb http://deb.debian.org|# &|' \
              -e 's|^# deb http://snapshot|deb [check-valid-until=no] http://snapshot|' \
              /etc/apt/sources.list
          fi
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Harness interpreter (not the engine's)
        run: |
          uv python install 3.12
          echo "PY=$(uv python find --managed-python 3.12)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: carto-linux-x64
          path: dist
      - name: The shipped .vsix parses, and searches memory offline
        shell: bash
        run: |
          $PY scripts/ci_smoke.py linux-x64 --vsix dist/carto-linux-x64-*.vsix \
            | tee -a "$GITHUB_STEP_SUMMARY"

  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-latest }
          - { target: win32-x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The frozen engine inherits the build interpreter's sqlite3, and the
      # python.org macOS build cannot load extensions, so sqlite-vec would ship
      # and never load. uv's CPython can; build-payload.py refuses one that
      # cannot, so a wrong choice here fails loudly rather than shipping.
      - if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@v6
      # Needs the network, and that is the point: it is spent HERE so the
      # artifact needs none. The payload carries its own tree-sitter grammars
      # and embedding model.
      - name: Build the payload
        shell: bash
        run: |
          args=()
          if [ "$RUNNER_OS" = macOS ]; then
            uv python install 3.12
            args=(--python "$(uv python find --system --managed-python 3.12)")
          fi
          python scripts/build-payload.py --target ${{ matrix.target }} "${args[@]}"
      - name: Package the .vsix
        shell: bash
        run: ./scripts/build-vsix.sh ${{ matrix.target }}
      # On Windows the network block is an outbound firewall rule for the
      # binary, which needs the runner's administrator rights.
      - name: The frozen engine parses, and searches memory offline
        shell: bash
        run: python scripts/ci_smoke.py ${{ matrix.target }} | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: carto-${{ matrix.target }}
          # Only this platform's .vsix: the companion is universal and the
          # linux job uploads it, so three identical copies do not collide.
          path: dist/carto-*.vsix
          if-no-files-found: error

  release:
    needs: [linux, linux-targets, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          fail_on_unmatched_files: true
