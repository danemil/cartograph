[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartograph"
version = "2.3.8"
description = "Local-first knowledge graph for token-efficient code review, as a CLI"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Tirth" },
]
keywords = ["code-review", "knowledge-graph", "tree-sitter", "ai-coding-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter>=0.23.0,<1",
    # Declared range widened to admit 1.x, which is what is actually installed,
    # tested and frozen into the .vsix payload. The two lines are different
    # products: 0.x bundles its grammars in the wheel (47-59MB), 1.x is a 5MB
    # extension that fetches them at runtime into a per-user cache. Packaging
    # seeds that cache at build time precisely so a default-deny machine never
    # reaches the network — see docs/packaging.md.
    "tree-sitter-language-pack>=0.3.0,<2",
    "pyyaml>=6.0,<7",
    "networkx>=3.2,<4",
    "watchdog>=4.0.0,<7",
    "tomli>=2.0.0,<3; python_version < '3.11'",
]

[project.urls]
Homepage = "https://cartograph.com"
Repository = "https://github.com/tirth8205/code-review-graph"
Documentation = "https://github.com/tirth8205/code-review-graph/blob/main/docs/INDEX.md"
Changelog = "https://github.com/tirth8205/code-review-graph/blob/main/CHANGELOG.md"
Issues = "https://github.com/tirth8205/code-review-graph/issues"

[project.scripts]
# `carto` is the entry point every skill, hook and remediation string names.
# `cartograph` is a spelled-out alias; the pre-rename `code-review-graph` names
# are kept so an install or hook written before the rename still resolves.
carto = "cartograph.cli:main"
carto-daemon = "cartograph.daemon_cli:main"
cartograph = "cartograph.cli:main"
code-review-graph = "cartograph.cli:main"
crg-daemon = "cartograph.daemon_cli:main"

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0,<6",
    "numpy>=1.26,<3",
]
google-embeddings = [
    "google-genai>=1.0.0,<3",
]
communities = [
    "igraph>=0.11.0",
]
# Vector search over observations. Optional on purpose: the target machines
# install under default-deny egress and are not guaranteed a loadable SQLite
# extension, so `carto mem search` runs without it and reports `search_mode`
# keyword rather than claiming a semantic answer it did not compute.
memory = [
    "sqlite-vec>=0.1.6,<0.2",
]
eval = [
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]
wiki = [
    "ollama>=0.1.0",
]
all = [
    "cartograph[embeddings]",
    "cartograph[memory]",
    "cartograph[google-embeddings]",
    "cartograph[communities]",
    "cartograph[enrichment]",
    "cartograph[eval]",
    "cartograph[wiki]",
]
enrichment = [
    "jedi>=0.19.2",
]
dev = [
    "mypy>=1.10,<3",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=4.0,<8",
    "ruff>=0.3.0,<1",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["cartograph"]

[tool.hatch.build.targets.sdist]
include = [
    "cartograph/",
    "docs/",
    "hooks/",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
# Hatch adds readme- and licence-named files from anywhere in the tree on top
# of `include`, which pulled the issue tracker's hooks and the VS Code
# extension's own README and LICENSE into the source distribution. (Hatchling
# always ships `.gitignore`; that one cannot be excluded.)
exclude = [
    ".beads/",
    "cartograph-vscode/",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "diagrams/",  # diagram DSL scripts — intentionally compact, non-standard style
    "tests/fixtures/sample_databricks_notebook.ipynb",  # SQL/R/Scala cells are not valid Python
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"cartograph/visualization.py" = ["E501"]  # embedded HTML/JS template
"cartograph/_legacy_instructions.py" = ["E501"]  # verbatim past output, must not be reflowed
"tests/fixtures/sample_databricks_export.py" = ["F841", "W292"]  # intentional fixture patterns
"tests/fixtures/sample_notebook.ipynb" = ["F401", "I001"]  # fixture imports: intentionally unused, split across cells
"tests/test_multilang.py" = ["E501"]  # long assertions with explanatory comments

[tool.bandit]
# B101: assert used (fine in non-security code)
# B404: import subprocess (we need git interaction)
# B603: subprocess without shell=True (we use list args, not shell)
# B607: partial executable path (calling "git" by name is standard)
# B608: SQL f-string — false positive, we use parameterized "?" placeholders on a local SQLite DB
skips = ["B101", "B404", "B603", "B607", "B608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23,<2",
]
